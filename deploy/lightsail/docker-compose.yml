# Single-box production stack for Lightsail. Database, auth and realtime stay on Neon.
# Cloudflare Tunnel routes app.fairmind.xyz (see tunnel.yml); Next.js forwards /api/proxy/* to the backend.
services:
  # Brings the schema up to date (scripts/setup_db.py) and verifies it before the
  # backend starts; a failed migration or verify keeps the old backend running.
  migrate:
    build: ../../apps/backend
    image: fairmind-backend
    env_file: backend.env
    command: ["python", "scripts/setup_db.py"]
    networks: [app]
    restart: "no"

  backend:
    build: ../../apps/backend
    image: fairmind-backend
    env_file: backend.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # Only the frontend's proxy is trusted to say who the caller is (X-Forwarded-For);
      # rate limits and the audit trail read the address uvicorn derives from it.
      FORWARDED_ALLOW_IPS: 172.28.0.0/24
    networks: [app]
    volumes:
      - uploads:/app/uploads
      - datasets:/app/datasets
      - models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ../../apps/frontend
      args:
        NEXT_PUBLIC_NEON_REALTIME_URL: ${NEXT_PUBLIC_NEON_REALTIME_URL:-}
        NEXT_PUBLIC_AUTHENTIK_URL: ${NEXT_PUBLIC_AUTHENTIK_URL:-}
        NEXT_PUBLIC_AUTHENTIK_CLIENT_ID: ${NEXT_PUBLIC_AUTHENTIK_CLIENT_ID:-}
        NEXT_PUBLIC_AUTHENTIK_REDIRECT_URI: ${NEXT_PUBLIC_AUTHENTIK_REDIRECT_URI:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: fairmind-frontend
    env_file: frontend.env
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    networks: [app]
    depends_on: [backend]
    restart: unless-stopped

  # Outbound-only Cloudflare Tunnel: no inbound ports, TLS ends at Cloudflare
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate --config /etc/cloudflared/tunnel.yml --cred-file /etc/cloudflared/creds.json run ${TUNNEL_ID:?set TUNNEL_ID in .env}
    volumes:
      - ./tunnel.yml:/etc/cloudflared/tunnel.yml:ro
      - ./tunnel.json:/etc/cloudflared/creds.json:ro
    networks: [app]
    depends_on: [frontend]
    restart: unless-stopped

networks:
  # Fixed subnet so the backend's FORWARDED_ALLOW_IPS can name its proxies.
  app:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  uploads:
  datasets:
  models:
