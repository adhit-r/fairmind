[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22.12.0"

# Redirects for old URLs
[[redirects]]
  from = "https://blog.fairmind.xyz/*"
  to = "https://fairmind.xyz/blog/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/docs"
  to = "https://docs.fairmind.xyz"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://us.i.posthog.com https://eu.i.posthog.com; worker-src 'self' blob: data:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io;"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML files should not be cached
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Environment variables
[context.production.environment]
  NODE_ENV = "production"
  SITE_URL = "https://fairmind.xyz"

[context.deploy-preview.environment]
  NODE_ENV = "preview"
  SITE_URL = "https://deploy-preview-{id}--fairmind-website-t41tz.netlify.app"

[context.branch-deploy.environment]
  NODE_ENV = "development"
  SITE_URL = "https://{branch}--fairmind-website-t41tz.netlify.app"
