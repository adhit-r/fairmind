[project]
name = "fairmind-mcp"
version = "0.1.0"
description = "MCP server that lets a coding agent ask FairMind whether an AI system may ship and run fairness tests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Adhithya Rajasekaran", email = "adhithya@axonome.xyz" }]
# mcp 2.x renames FastMCP to MCPServer; this server targets the 1.x FastMCP API.
dependencies = ["fairmind", "mcp>=1.10,<2"]

[project.scripts]
fairmind-mcp = "fairmind_mcp.server:main"

[dependency-groups]
dev = ["pytest>=7.4"]

# uv resolves the SDK from this checkout; with pip, install ../sdk first (see README).
[tool.uv.sources]
fairmind = { path = "../sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fairmind_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
