[project]
name = "fairmind-cli"
version = "0.1.0"
description = "Run FairMind's release gate and fairness tests from a terminal or CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Adhithya Rajasekaran", email = "adhithya@axonome.xyz" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
fairmind = "fairmind_cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fairmind_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
