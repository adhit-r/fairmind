<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FairMind social collateral</title>
<link rel="stylesheet" href="assets/social.css">
<style>
  body { padding: 64px; }
  html, body { height: auto; overflow: visible; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 48px; }
  header .brand { font-size: 28px; }
  header .eyebrow { font-size: 16px; }
  .grid { display: grid; gap: 40px 32px; align-items: end; }
  .r1 { grid-template-columns: repeat(3, 1fr) 0.88fr; }
  .r2 { grid-template-columns: 1fr 1fr 1.6fr; margin-top: 48px; }
  .r3 { grid-template-columns: 1fr 1fr; margin-top: 48px; align-items: start; }
  figure { margin: 0; }
  figure img { display: block; width: 100%; height: auto; border-radius: 10px; outline: 1px solid rgba(21,23,26,.12); box-shadow: var(--shadow); }
  figcaption { margin-top: 12px; font-size: 15px; font-weight: 500; color: var(--ink2); }
  figcaption b { color: var(--ink); font-weight: 600; }
</style></head>
<body>
  <header><div class="brand"><img src="assets/logo-mark.svg" alt="">FairMind</div><div class="eyebrow">Social collateral, November 2026</div></header>
  <div class="grid r1">
    <figure><img src="poster-question-4x5.png" alt=""><figcaption><b>Feed poster 4:5</b> The question</figcaption></figure>
    <figure><img src="poster-person-decides-4x5.png" alt=""><figcaption><b>Feed poster 4:5</b> A person decides</figcaption></figure>
    <figure><img src="poster-comparison-4x5.png" alt=""><figcaption><b>Feed poster 4:5</b> Where it sits</figcaption></figure>
    <figure><img src="poster-event-a3.png" alt=""><figcaption><b>Event poster A3</b> PDF for print</figcaption></figure>
  </div>
  <div class="grid r2">
    <figure><img src="square-numbers-1x1.png" alt=""><figcaption><b>Square 1:1</b> The catalogue</figcaption></figure>
    <figure><img src="square-lifecycle-1x1.png" alt=""><figcaption><b>Square 1:1</b> The lifecycle</figcaption></figure>
    <figure><img src="og-card.png" alt=""><figcaption><b>Link card</b> 1200 x 630</figcaption></figure>
  </div>
  <div class="grid r3">
    <figure><img src="banner-linkedin-personal.png" alt=""><figcaption><b>LinkedIn personal cover</b> 1584 x 396</figcaption></figure>
    <figure><img src="banner-x-header.png" alt=""><figcaption><b>X header</b> 1500 x 500</figcaption></figure>
    <figure><img src="banner-linkedin-company.png" alt=""><figcaption><b>LinkedIn company cover</b> 1128 x 191</figcaption></figure>
    <figure><img src="banner-youtube.png" alt=""><figcaption><b>YouTube channel art</b> 2560 x 1440</figcaption></figure>
  </div>
</body></html>
