<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FairMind: a person decides</title>
<link rel="stylesheet" href="assets/social.css">
<style>
  .eyebrow { position: absolute; left: 72px; top: 76px; font-size: 24px; }
  h1 { position: absolute; left: 72px; right: 72px; top: 136px; font-size: 82px; line-height: 1.04; letter-spacing: -0.035em; white-space: nowrap; }
  h1 span { display: block; color: var(--ink2); margin-top: 14px; }
  .sub { position: absolute; left: 72px; width: 820px; top: 380px; margin: 0; font-size: 32px; line-height: 1.3; font-weight: 500; color: var(--ink2); letter-spacing: -0.01em; }
  .shot { left: 408px; top: 520px; width: 624px; height: 590px; --x: 801; --y: 0; --s: 1.3; }
  .note { position: absolute; left: 72px; width: 290px; top: 640px; }
  .note .eyebrow { position: static; font-size: 20px; }
  .note p { margin: 18px 0 0; font-size: 32px; line-height: 1.22; font-weight: 600; letter-spacing: -0.02em; }
  footer { position: absolute; left: 72px; right: 72px; bottom: 58px; display: flex; align-items: center; justify-content: space-between; }
  footer .brand { font-size: 30px; }
  footer .cta { font-size: 26px; font-weight: 500; color: var(--ink2); }
  footer .cta b { color: var(--ink); font-weight: 600; }
</style></head>
<body><div class="frame">
  <div class="eyebrow">The rule</div>
  <h1>The result is evidence.<span>A person decides.</span></h1>
  <p class="sub">An evaluation result is evidence for a decision, never the decision itself.</p>
  <div class="note">
    <div class="eyebrow">Separation</div>
    <p>A pending release request is decided by someone other than the person who asked.</p>
  </div>
  <div class="shot"><img src="assets/decisions.jpg" alt="A pending release request in FairMind, waiting for a reviewer"></div>
  <footer>
    <div class="brand"><img src="assets/logo-mark.svg" alt="">FairMind</div>
    <div class="cta">Try the live demo: <b>app.fairmind.xyz</b></div>
  </footer>
</div></body></html>
