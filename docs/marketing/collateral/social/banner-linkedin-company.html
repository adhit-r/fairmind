<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FairMind LinkedIn company cover</title>
<link rel="stylesheet" href="assets/social.css">
<style>
  .lock { position: absolute; display: flex; flex-direction: column; }
  .lock h1 { font-weight: 600; letter-spacing: -0.035em; line-height: 1.08; }
  .lock h1 span { display: block; color: var(--ink2); }
  .lock .url { font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
  /* left ~300px kept clear for the page logo */
  .lock { left: 330px; right: 56px; top: 50%; transform: translateY(-50%); gap: 14px; }
  .lock .brand { font-size: 24px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }
  .lock h1 { font-size: 22px; line-height: 1.12; white-space: nowrap; letter-spacing: -0.025em; }
  .lock h1 span { display: inline; }
  .lock .url { font-size: 18px; }
</style></head>
<body><div class="frame">
<div class="lock"><div class="brand"><img src="assets/logo-mark.svg" alt="">FairMind</div><div class="row"><h1>An open-source AI assurance workbench <span>for models and agents.</span></h1><div class="url">fairmind.xyz</div></div></div>
</div></body></html>
