<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FairMind YouTube channel art</title>
<link rel="stylesheet" href="assets/social.css">
<style>
  .lock { position: absolute; display: flex; flex-direction: column; }
  .lock h1 { font-weight: 600; letter-spacing: -0.035em; line-height: 1.08; }
  .lock h1 span { display: block; color: var(--ink2); }
  .lock .url { font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
  /* TV shows all 2560x1440; every device shows the centre 1546x423 (x 507-2053, y 508-932). All content sits inside it. */
  .lock { left: 50%; top: 50%; transform: translate(-50%, -50%); align-items: center; text-align: center; gap: 34px; width: 1546px; }
  .lock .brand { font-size: 44px; }
  .lock h1 { font-size: 76px; white-space: nowrap; }
  .lock .url { font-size: 34px; }
</style></head>
<body><div class="frame">
<div class="lock"><div class="brand"><img src="assets/logo-mark.svg" alt="">FairMind</div><h1>An open-source AI assurance workbench<span>for models and agents.</span></h1><div class="url">fairmind.xyz</div></div>
</div></body></html>
