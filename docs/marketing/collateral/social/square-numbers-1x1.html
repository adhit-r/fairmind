<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FairMind: the catalogue</title>
<link rel="stylesheet" href="assets/social.css">
<style>
  .eyebrow { position: absolute; left: 72px; top: 72px; font-size: 24px; }
  .when { position: absolute; right: 72px; top: 72px; font-size: 24px; font-weight: 500; color: var(--ink3); line-height: 1; padding-top: 2px; }
  main { position: absolute; left: 72px; right: 72px; top: 150px; bottom: 160px; display: flex; flex-direction: column; justify-content: center; }
  .row { display: grid; grid-template-columns: 300px 1fr; align-items: baseline; padding: 36px 0; border-top: 1px solid rgba(21,23,26,.12); }
  .row:first-child { border-top: 0; }
  .n { font-size: 128px; font-weight: 600; letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums; }
  .t { font-size: 38px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.12; }
  .t small { display: block; margin-top: 12px; font-size: 26px; font-weight: 500; letter-spacing: -0.005em; color: var(--ink2); line-height: 1.3; }
  footer { position: absolute; left: 72px; right: 72px; bottom: 58px; display: flex; align-items: center; justify-content: space-between; }
  footer .brand { font-size: 30px; }
  footer .url { font-size: 26px; font-weight: 600; }
</style></head>
<body><div class="frame">
  <div class="eyebrow">The open catalogue</div>
  <div class="when">Counted November 2026</div>
  <main>
    <div class="row"><div class="n">109</div><div class="t">evaluations<small>In four pillars: Govern, Evaluate, Secure, Comply.</small></div></div>
    <div class="row"><div class="n">51</div><div class="t">frameworks, standards and risk lists<small>EU AI Act, ISO/IEC 42001, NIST AI RMF, RBI FREE-AI and more.</small></div></div>
    <div class="row"><div class="n">922</div><div class="t">crosswalk links<small>539 requirements. 29 common controls.</small></div></div>
  </main>
  <footer>
    <div class="brand"><img src="assets/logo-mark.svg" alt="">FairMind</div>
    <div class="url">fairmind.xyz</div>
  </footer>
</div></body></html>
