name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          # Approved exemption: glib 0.18 (GTK3) reaches apps/notifier/Cargo.lock only through tray-icon's Linux
          # backend. The notifier builds for macOS and Windows only (it refuses to compile on Linux) and never uses
          # glib::VariantStrIter.
          allow-ghsas: GHSA-wrw7-89jp-8q8g
