name: Tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # the full suite takes about 30 minutes on PostgreSQL
    services:
      postgres:
        # The *_postgres.py suites assert server_version 14, the release authority.
        image: postgres:14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust  # disposable container, no credentials
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    env:
      UV_PYTHON: "3.11"
      # A server the tests may create and drop databases on; tests/pg.py builds the app database
      # and sets DATABASE_URL itself.
      FAIRMIND_TEST_POSTGRES_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Unit and Postgres tests
        run: uv run --frozen --extra test pytest -q -rfEs tests --ignore=tests/e2e

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22  # matches apps/frontend/Dockerfile
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npx --yes tsx@4.23.15 --test 'src/**/*.test.ts'

  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ripgrep
        run: command -v rg || (sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep)
      - name: Backend layer boundaries
        run: tooling/check_backend_layer_boundaries.sh
      - name: Archive import isolation
        run: tooling/check_no_archive_imports.sh
      - name: Frontend design rules
        run: tooling/check_frontend_design_rules.sh

  packages:
    name: ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [ cli, sdk, mcp ]
    defaults:
      run:
        working-directory: apps/${{ matrix.package }}
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Tests
        run: uv run --with pytest pytest -q -p no:cacheprovider tests
