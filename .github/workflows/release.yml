name: Release

# Runs when a GitHub release is published. Zenodo archives the release and
# mints its version DOI; this workflow attaches signed packages and pushes
# the backend image.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  python-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach files to the release
      id-token: write   # Sigstore keyless signing
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Version the packages from the release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        shell: python
        run: |
          import os, re, pathlib
          # v0.3.0-alpha -> 0.3.0a0, v0.4.0-beta.2 -> 0.4.0b2, v1.2.0-rc1 -> 1.2.0rc1 (PEP 440)
          tag = os.environ["TAG"].lstrip("v")
          v = re.sub(r"-(alpha|beta|rc)\.?(\d*)$", lambda m: {"alpha": "a", "beta": "b", "rc": "rc"}[m[1]] + (m[2] or "0"), tag)
          files = {
              "apps/sdk/pyproject.toml": r'^version = ".*"',
              "apps/cli/pyproject.toml": r'^version = ".*"',
              "apps/mcp/pyproject.toml": r'^version = ".*"',
              "apps/sdk/src/fairmind/__init__.py": r'^__version__ = ".*"',
              "apps/cli/fairmind_cli/__init__.py": r'^__version__ = ".*"',
          }
          for path, pattern in files.items():
              f = pathlib.Path(path)
              text, n = re.subn(pattern, pattern.split(" = ")[0].lstrip("^") + f' = "{v}"', f.read_text(), count=1, flags=re.M)
              assert n == 1, f"no version line in {path}"
              f.write_text(text)
          print("packages versioned", v)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={v}\n")
      - name: Build sdk, cli and mcp
        run: |
          for pkg in sdk cli mcp; do
            uv build "apps/$pkg" --out-dir dist
          done
      - name: Keep the built packages for the PyPI job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - name: Hash the packages for provenance
        id: hash
        run: echo "hashes=$(cd dist && sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Sign with Sigstore and attach to the release
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          release-signing-artifacts: true

  # SLSA build provenance for the packages, attached to the release as an .intoto.jsonl file.
  # A reusable workflow must be referenced by tag; slsa-github-generator verifies its own ref.
  provenance:
    needs: python-packages
    permissions:
      actions: read     # read the workflow run
      id-token: write   # sign the provenance
      contents: write   # attach it to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.python-packages.outputs.hashes }}
      upload-assets: true

  # Publishes to PyPI through trusted publishers (no token). PyPI allows one
  # pending publisher per repository, workflow and environment, so each
  # package has its own environment.
  pypi:
    needs: python-packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: fairmind
            files: fairmind-*
            environment: pypi
          - project: fairmind-cli
            files: fairmind_cli-*
            environment: pypi-cli
          - project: fairmind-mcp
            files: fairmind_mcp-*
            environment: pypi-mcp
    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/project/${{ matrix.project }}/
    permissions:
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: all/
      - name: Pick this project's files
        env:
          FILES: ${{ matrix.files }}
        run: |
          mkdir dist
          mv all/$FILES dist/
          ls dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Lists the MCP server in the official MCP Registry once fairmind-mcp is on PyPI.
  # The registry checks the mcp-name line in apps/mcp/README.md.
  mcp-registry:
    needs: [python-packages, pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # MCP Registry GitHub OIDC login
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.8
      VERSION: ${{ needs.python-packages.outputs.version }}
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Set the version in server.json
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  backend-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/fairmind-backend
          tags: type=semver,pattern={{raw}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
