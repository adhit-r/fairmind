name: E2E Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

# The backend signs this account in without a users table (development only;
# see config.auth._e2e_admin). The same values drive the Playwright login.
env:
  E2E_ADMIN_EMAIL: e2e-admin@fairmind.ai
  E2E_ADMIN_PASSWORD: e2e-only-never-a-real-account

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-24.04  # Playwright cannot install chromium on ubuntu-latest (26.04) yet
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust  # throwaway CI database, no password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "latest"

    - name: Install dependencies
      working-directory: apps/backend
      run: uv sync --frozen --extra test

    - name: Install Playwright browsers
      working-directory: apps/backend
      run: uv run playwright install --with-deps chromium

    - name: Create database
      working-directory: apps/backend
      run: |
        psql postgresql://postgres@localhost:5432/postgres -c "CREATE DATABASE fairmind_e2e"
        uv run python scripts/setup_db.py
      env:
        DATABASE_URL: postgresql://postgres@localhost:5432/fairmind_e2e

    - name: Start backend server
      working-directory: apps/backend
      run: |
        uv run uvicorn api.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
        sleep 5
      env:
        APP_ENV: development
        DATABASE_URL: postgresql://postgres@localhost:5432/fairmind_e2e
        RATE_LIMIT_REQUESTS: "10000"

    - name: Start frontend server
      working-directory: apps/frontend
      run: |
        npm ci --no-audit --no-fund
        npm run build
        npm run start &
        sleep 10
      env:
        PORT: "1111"
        NEXT_PUBLIC_API_URL: http://localhost:8000

    - name: Run E2E tests
      working-directory: apps/backend
      run: |
        uv run pytest tests/e2e/ -m e2e --tb=short -v
      env:
        E2E_BASE_URL: http://localhost:1111
        E2E_API_URL: http://localhost:8000
        E2E_HEADLESS: "true"
        FAIRMIND_TEST_POSTGRES_URL: postgresql://postgres@localhost:5432/postgres

    - name: Backend log
      if: always()
      working-directory: apps/backend
      run: |
        grep -v -E '"name": "databases"' backend.log > backend.filtered.log || true
        echo '::group::key lines'; grep -E 'Database identities|Database tables ready|Could not create table|Login error|table creation failed|Failed to initialize|ORM table creation' backend.log | head -n 60; echo '::endgroup::'
        echo '::group::database'; DATABASE_URL=postgresql://postgres@localhost:5432/fairmind_e2e uv run --no-sync python scripts/setup_db.py verify || true; echo '::endgroup::'
        echo '::group::startup'; head -n 200 backend.filtered.log; echo '::endgroup::'
        echo '::group::tail'; tail -n 300 backend.filtered.log; echo '::endgroup::'

    
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-screenshots
        path: apps/backend/tests/e2e/screenshots/
        if-no-files-found: ignore
    
    - name: Upload test videos
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-videos
        path: apps/backend/tests/e2e/videos/
        if-no-files-found: ignore

  e2e-smoke-tests:
    runs-on: ubuntu-24.04  # Playwright cannot install chromium on ubuntu-latest (26.04) yet
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust  # throwaway CI database, no password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "latest"

    - name: Install dependencies
      working-directory: apps/backend
      run: uv sync --frozen --extra test

    - name: Install Playwright browsers
      working-directory: apps/backend
      run: uv run playwright install --with-deps chromium

    - name: Create database
      working-directory: apps/backend
      run: |
        psql postgresql://postgres@localhost:5432/postgres -c "CREATE DATABASE fairmind_e2e"
        uv run python scripts/setup_db.py
      env:
        DATABASE_URL: postgresql://postgres@localhost:5432/fairmind_e2e

    - name: Start backend server
      working-directory: apps/backend
      run: |
        uv run uvicorn api.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
        sleep 5
      env:
        APP_ENV: development
        DATABASE_URL: postgresql://postgres@localhost:5432/fairmind_e2e
        RATE_LIMIT_REQUESTS: "10000"

    - name: Start frontend server
      working-directory: apps/frontend
      run: |
        npm ci --no-audit --no-fund
        npm run build
        npm run start &
        sleep 10
      env:
        PORT: "1111"
        NEXT_PUBLIC_API_URL: http://localhost:8000

    - name: Run smoke tests
      working-directory: apps/backend
      run: |
        uv run pytest tests/e2e/ -m "e2e and smoke" --tb=short -v
      env:
        E2E_BASE_URL: http://localhost:1111
        E2E_API_URL: http://localhost:8000
        E2E_HEADLESS: "true"
        FAIRMIND_TEST_POSTGRES_URL: postgresql://postgres@localhost:5432/postgres

    - name: Backend log
      if: always()
      working-directory: apps/backend
      run: |
        grep -v -E '"name": "databases"' backend.log > backend.filtered.log || true
        echo '::group::key lines'; grep -E 'Database identities|Database tables ready|Could not create table|Login error|table creation failed|Failed to initialize|ORM table creation' backend.log | head -n 60; echo '::endgroup::'
        echo '::group::database'; DATABASE_URL=postgresql://postgres@localhost:5432/fairmind_e2e uv run --no-sync python scripts/setup_db.py verify || true; echo '::endgroup::'
        echo '::group::startup'; head -n 200 backend.filtered.log; echo '::endgroup::'
        echo '::group::tail'; tail -n 300 backend.filtered.log; echo '::endgroup::'

