version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # tensorflow 2.21 requires h5py<3.15; a 3.16 bump made requirements.txt uninstallable.
      - dependency-name: "h5py"
        versions: [">=3.15"]
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /apps/frontend
      - /apps/website
      - /apps/docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/apps/backend, /apps/frontend, /apps/website]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # A Python minor bump changes which wheels exist: 3.15 has none for scipy, so the
      # backend image failed to build. Move Python by hand, with the test matrix.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
    groups:
      docker-images:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
