name: FairMind release gate
description: Fail the job when an AI system's FairMind release gate is not green; optionally run a fairness test on a predictions CSV first.
author: Axonome

inputs:
  system:
    description: FairMind AI system id
    required: true
  api-url:
    description: FairMind API base URL
    required: true
  api-key:
    description: FairMind API key (POST /api/v1/auth/api-keys)
    required: true
  allow-conditional:
    description: Pass the job on a conditional go
    required: false
    default: "false"
  predictions:
    description: Path to a predictions CSV. When set, a fairness test runs and is stored as evidence before the gate is read.
    required: false
    default: ""
  outcome:
    description: Outcome column (0/1) in the predictions CSV
    required: false
    default: ""
  prediction:
    description: Prediction column (0/1) in the predictions CSV
    required: false
    default: ""
  score:
    description: Score column (0 to 1) in the predictions CSV
    required: false
    default: ""
  attributes:
    description: Comma-separated protected attribute columns
    required: false
    default: ""
  cli-source:
    description: Where to install the CLI from (a path or a pip requirement)
    required: false
    default: "./apps/cli"

outputs:
  verdict:
    description: go, conditional_go or no_go
    value: ${{ steps.gate.outputs.verdict }}

runs:
  using: composite
  steps:
    - name: Install the fairmind CLI
      shell: bash
      run: python -m pip install --quiet "${{ inputs.cli-source }}"

    - name: Run the fairness test
      if: inputs.predictions != ''
      shell: bash
      env:
        FAIRMIND_API_URL: ${{ inputs.api-url }}
        FAIRMIND_API_KEY: ${{ inputs.api-key }}
      run: |
        args=(test --system "${{ inputs.system }}" --file "${{ inputs.predictions }}" --outcome "${{ inputs.outcome }}" --attributes "${{ inputs.attributes }}")
        [ -n "${{ inputs.prediction }}" ] && args+=(--prediction "${{ inputs.prediction }}")
        [ -n "${{ inputs.score }}" ] && args+=(--score "${{ inputs.score }}")
        # The test's own exit code is informational here; the gate below decides.
        fairmind "${args[@]}" || true

    - name: Read the release gate
      id: gate
      shell: bash
      env:
        FAIRMIND_API_URL: ${{ inputs.api-url }}
        FAIRMIND_API_KEY: ${{ inputs.api-key }}
      run: |
        set +e
        fairmind gate --system "${{ inputs.system }}" --json > gate.json
        code=$?
        set -e
        if [ "$code" -eq 3 ]; then cat gate.json; exit 3; fi
        verdict=$(python -c 'import json; print(json.load(open("gate.json"))["verdict"])')
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        fairmind gate --system "${{ inputs.system }}" || true
        if [ "$verdict" = "go" ]; then exit 0; fi
        if [ "$verdict" = "conditional_go" ] && [ "${{ inputs.allow-conditional }}" = "true" ]; then exit 0; fi
        echo "::error title=FairMind release gate::$verdict for system ${{ inputs.system }}"
        exit 1
