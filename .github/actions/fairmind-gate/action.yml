name: FairMind release gate
description: Fail the job when an AI system's FairMind release gate is not green; optionally run a fairness test on a predictions CSV first.
author: Axonome

inputs:
  system:
    description: FairMind AI system id
    required: true
  api-url:
    description: FairMind API base URL
    required: true
  api-key:
    description: FairMind API key (POST /api/v1/auth/api-keys)
    required: true
  allow-conditional:
    description: Pass the job on a conditional go
    required: false
    default: "false"
  require-approval:
    description: Fail the job unless the system's release decision is approved (with or without conditions)
    required: false
    default: "false"
  predictions:
    description: Path to a predictions CSV. When set, a fairness test runs and is stored as evidence before the gate is read.
    required: false
    default: ""
  outcome:
    description: Outcome column (0/1) in the predictions CSV
    required: false
    default: ""
  prediction:
    description: Prediction column (0/1) in the predictions CSV
    required: false
    default: ""
  score:
    description: Score column (0 to 1) in the predictions CSV
    required: false
    default: ""
  attributes:
    description: Comma-separated protected attribute columns
    required: false
    default: ""
  cli-source:
    description: Where to install the CLI from (a path or a pip requirement). Empty installs the CLI that ships with this action.
    required: false
    default: ""

outputs:
  verdict:
    description: go, conditional_go or no_go
    value: ${{ steps.gate.outputs.verdict }}
  approval:
    description: The release decision, not_requested, pending, approved or rejected
    value: ${{ steps.gate.outputs.approval }}

runs:
  using: composite
  steps:
    # Every input is passed through env vars and referenced as a shell variable.
    # Interpolating ${{ inputs.* }} directly into a run: script lets a crafted
    # input value inject shell commands on the runner (template injection).
    - name: Install the fairmind CLI
      shell: bash
      env:
        CLI_SOURCE: ${{ inputs.cli-source }}
      # GitHub checks out the whole repository for `uses: owner/repo/path@ref`, so
      # apps/cli sits three levels above the action in a customer's job and in this repo.
      run: python -m pip install --quiet "${CLI_SOURCE:-$GITHUB_ACTION_PATH/../../../apps/cli}"

    - name: Run the fairness test
      if: inputs.predictions != ''
      shell: bash
      env:
        FAIRMIND_API_URL: ${{ inputs.api-url }}
        FAIRMIND_API_KEY: ${{ inputs.api-key }}
        SYSTEM: ${{ inputs.system }}
        PREDICTIONS: ${{ inputs.predictions }}
        OUTCOME: ${{ inputs.outcome }}
        ATTRIBUTES: ${{ inputs.attributes }}
        PREDICTION: ${{ inputs.prediction }}
        SCORE: ${{ inputs.score }}
      run: |
        args=(test --system "$SYSTEM" --file "$PREDICTIONS" --outcome "$OUTCOME" --attributes "$ATTRIBUTES")
        [ -n "$PREDICTION" ] && args+=(--prediction "$PREDICTION")
        [ -n "$SCORE" ] && args+=(--score "$SCORE")
        # The test's own exit code is informational here; the gate below decides.
        fairmind "${args[@]}" || true

    - name: Read the release gate
      id: gate
      shell: bash
      env:
        FAIRMIND_API_URL: ${{ inputs.api-url }}
        FAIRMIND_API_KEY: ${{ inputs.api-key }}
        SYSTEM: ${{ inputs.system }}
        ALLOW_CONDITIONAL: ${{ inputs.allow-conditional }}
        REQUIRE_APPROVAL: ${{ inputs.require-approval }}
      run: |
        set +e
        fairmind gate --system "$SYSTEM" --json > gate.json
        code=$?
        set -e
        if [ "$code" -eq 3 ]; then cat gate.json; exit 3; fi
        verdict=$(python -c 'import json; print(json.load(open("gate.json"))["verdict"])')
        approval=$(python -c 'import json; print(json.load(open("gate.json")).get("approvalStatus", "not_reported"))')
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "approval=$approval" >> "$GITHUB_OUTPUT"
        fairmind gate --system "$SYSTEM" || true
        if [ "$REQUIRE_APPROVAL" = "true" ] && [ "$approval" != "approved" ]; then
          echo "::error title=FairMind release gate::release decision is $approval for system $SYSTEM"
          exit 1
        fi
        if [ "$verdict" = "go" ]; then exit 0; fi
        # An approved conditional go passes require-approval: the reviewer accepted its conditions.
        if [ "$verdict" = "conditional_go" ] && { [ "$ALLOW_CONDITIONAL" = "true" ] || [ "$REQUIRE_APPROVAL" = "true" ]; }; then exit 0; fi
        echo "::error title=FairMind release gate::$verdict for system $SYSTEM"
        exit 1
